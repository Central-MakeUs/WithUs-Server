spring:
  application:
    name: withus

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  data:
    redis:
      host: redis
      port: 6379

#  sql:
#    init:
#      mode: always

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.herethere.withus: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE

    com.herethere.withus.auth.externalapi: DEBUG
    feign.Logger: DEBUG

feign:
  client:
    config:
      default:
        loggerLevel: FULL

server:
  forward-headers-strategy: framework

oauth:
  kakako:
    app:
      adminKey: ${OAUTH_KAKAO_APP_ADMINKEY}
  apple:
    app:
      keyId: ${OAUTH_APPLE_APP_KEYID}
      teamId: ${OAUTH_APPLE_APP_TEAMID}
      id: ${OAUTH_APPLE_APP_ID}
      privateKey: ${OAUTH_APPLE_APP_PRIVATEKEY}

springdoc:
  use-fqn: true
