events {
    worker_connections 1024;
}

http {
    upstream spring_app {
        server withus-app:8080;
    }

    server {
        listen 80;
        server_name withus.p-e.kr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name withus.p-e.kr;

        ssl_certificate /etc/letsencrypt/live/withus.p-e.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/withus.p-e.kr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # ✅ 1. 딥링크 인증 파일 (iOS + Android)
        location /.well-known/ {
            root /var/www/html;
            default_type application/json;
            try_files $uri =404;
        }

        # ✅ 2. 나머지는 Spring으로
        location / {
            proxy_pass http://spring_app;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 443;
        }
    }
}
